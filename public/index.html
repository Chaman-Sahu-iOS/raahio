/* ---------- web sync (Netlify function + Blobs) ---------- */
function api(method,body){return fetch('/api/state?k='+encodeURIComponent(WK),{method:method,headers:{'content-type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'}).then(function(r){return r.json().then(function(j){return {status:r.status,data:j}})})}
function typing(){var ae=document.activeElement;return !!(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))}
function webPull(){
  if(!WK||pulling||pushing)return;pulling=true;
  api('GET').then(function(res){var d=res.data;if(res.status!==200)throw new Error(d&&d.error||res.status);
    if(!d.state){if((S.updatedAt||0)>0){unsynced=true;pulling=false;webPush();return}webEmpty=true;setSync('synced');render();return}
    serverTs=d.updatedAt;
    if(d.updatedAt>(S.updatedAt||0)){if(typing()||sheetOpen)return;S=d.state;ls(LS,S);unsynced=false;webEmpty=false;render();setSync('synced')}
    else if(d.updatedAt<(S.updatedAt||0)&&unsynced){pulling=false;webPush();return}
    else{unsynced=false;webEmpty=false;setSync('synced')}
  }).catch(function(){setSync('offline')}).then(function(){pulling=false});
}
function webPush(){
  if(!WK)return;if(pushing){pushAgain=true;return}pushing=true;setSync('busy');var snap=S.updatedAt;
  api('PUT',{base:serverTs,state:S}).then(function(res){
    if(res.status===200){serverTs=res.data.updatedAt;if(S.updatedAt===snap)unsynced=false;setSync(unsynced?'pending':'synced')}
    else if(res.status===409&&res.data&&res.data.state){S=res.data.state;serverTs=res.data.updatedAt;ls(LS,S);unsynced=false;closeSheet();render();setSync('synced');toast('Someone else changed the trip a moment ago. You are now seeing their latest version; please redo your last change.',{sticky:true})}
    else throw new Error('save failed');
  }).catch(function(){setSync('offline')}).then(function(){pushing=false;if(pushAgain){pushAgain=false;webPush()}});
}

function setSync(st){syncStatus=st;var el=$('#syncpill');if(el){el.className='sync '+({synced:'ok',busy:'busy',err:'err',pending:'busy'}[st]||'');el.textContent=syncLabel()}}
function syncLabel(){return {local:'Saved',pending:'Saving…',busy:'Syncing…',synced:'Synced',err:'On this phone',device:'On this phone',offline:'Offline'}[syncStatus]||'Saved'}
function scheduleSync(){
  if(WEB){setSync('pending');clearTimeout(webT);webT=setTimeout(webPush,1200);return}
  if(!caps.artifact){setSync(caps.ready?'device':'pending');return}
  setSync('pending');clearTimeout(syncTimer);syncTimer=setTimeout(trySync,4000);
}
function trySync(){
  if(!caps.artifact||!unsynced)return;
  var ae=document.activeElement;
  if(sheetOpen||busy||(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))){clearTimeout(syncTimer);syncTimer=setTimeout(trySync,3000);return}
  setSync('busy');saveUI();ss(CK,chat);
  caps.artifact.publish(buildDoc()).then(function(){unsynced=false;setSync('synced')}).catch(function(err){
    var c=err&&err.code;
    if(c==='conflict'){return}
    if(c==='not_granted'||c==='not_writer'){caps.artifact=null;setSync('device');return}
    setSync('err');
  });
}
function capUse(){return Promise.resolve(null)}
var AINAME='AI';
function webSample(msgs,opts){
  opts=opts||{};var tools=(opts.tools||[]),defs=tools.map(function(t){return {type:'function',function:{name:t.name,description:t.description,parameters:t.inputSchema||{type:'object',properties:{}}}}});
  var messages=msgs.map(function(m){return {role:m.role,content:m.content}});
  function step(i){
    if(i>6)return Promise.resolve({text:'Done.'});
    return fetch('/api/ai?k='+encodeURIComponent(WK),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({messages:messages,tools:defs})}).then(function(r){return r.json().catch(function(){return {}}).then(function(d){
      if(!r.ok)throw {code:r.status===429?'rate_limited':r.status===503?'not_granted':'error',message:d.error||('AI error '+r.status)};
      var m=d.message||{content:''};messages.push({role:'assistant',content:m.content||null,tool_calls:m.tool_calls});
      if(m.tool_calls&&m.tool_calls.length){
        return m.tool_calls.reduce(function(p,tc){return p.then(function(){var tool=tools.filter(function(t){return t.name===(tc.function&&tc.function.name)})[0],out;
          try{var args=JSON.parse((tc.function&&tc.function.arguments)||'{}');out=tool?String(tool.execute(args)):'Unknown tool'}catch(e){out='Error: '+e.message}
          messages.push({role:'tool',tool_call_id:tc.id,content:out})})},Promise.resolve()).then(function(){return step(i+1)});
      }
      var text=m.content||'Done.';if(opts.onText)opts.onText({text:text});return {text:text};
    })});
  }
  return step(0);
}
function initCaps(tries){
  if(WEB){caps.ready=true;if(WK){fetch('/api/ai').then(function(r){return r.json()}).then(function(d){if(d&&d.enabled){caps.sample=webSample;if(ui.tab==='assistant')render();if(vState.open)voiceRender()}}).catch(function(){})}if(WK){webPull();setInterval(function(){if(!unsynced&&!sheetOpen&&document.visibilityState==='visible')webPull();else if(unsynced&&syncStatus==='offline')webPush()},15000);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')webPull()})}return}
  tries=tries||0;
  Promise.all([capUse('artifact'),capUse('sample'),capUse('downloads'),capUse('dictation'),capUse('tts')]).then(function(r){
    caps.artifact=r[0];caps.sample=r[1];caps.downloads=r[2];caps.dictation=r[3];caps.tts=r[4];caps.ready=true;
    if(unsynced&&caps.artifact)setSync('pending');else if(!caps.artifact)setSync('device');else setSync('synced');
    if(ui.tab==='assistant'||ui.tab==='more')render();
  });
}

/* ---------- derived ---------- */
function tripBounds(){var t=T(),ev=sorted(),s=ev.filter(function(e){return e.date>=t.start});return {start:s.length?evTs(s[0]):ts(t.start,'00:00'),end:ts(t.end,'23:59')}}
function ctx(){
  var n=now(),ev=sorted(),cur=null,next=null,missed=[];
  for(var i=0;i<ev.length;i++){var e=ev[i],t=evTs(e);
    if(t<=n){var nx=ev[i+1];if(!nx||evTs(nx)>n){if(n-t<4*3600000&&e.status==='todo')cur=e}
      if(e.status==='todo'&&e!==cur&&n-t>15*60000)missed.push(e)}
    else if(!next&&e.status==='todo')next=e}
  return {now:n,cur:cur,next:next,missed:missed.reverse()}
}
function allReminders(){
  var t=T(),out=[];
  (t.reminders||[]).forEach(function(r){var a=r.at.split('T');out.push({key:'r:'+r.id+':'+r.at,kind:'r',ref:r,due:ts(a[0],a[1]),text:r.text,done:r.done})});
  t.events.forEach(function(e){if(e.remind===null||e.remind===undefined||e.remind==='')return;var d=evTs(e)-Number(e.remind)*60000;
    out.push({key:'e:'+e.id+':'+e.date+e.time+':'+e.remind,kind:'e',ref:e,due:d,text:(Number(e.remind)?e.remind+' min to: ':'')+e.title,done:e.status!=='todo'})});
  return out.sort(function(a,b){return a.due-b.due});
}
function dayKind(date){var t=T();if(date<t.start)return 'Prep';if(date>t.end)return 'After';var n=Math.round((ts(date,'12:00')-ts(t.start,'12:00'))/86400000)+1;return 'Day '+n}
function gcal(title,start,mins,details){var f=function(x){return new Date(x).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')};return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(title)+'&dates='+f(start)+'/'+f(start+mins*60000)+'&details='+encodeURIComponent(details||'')+'&ctz=Asia/Kolkata'}
function maps(q){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)}
function placeById(id){return (T().places||[]).filter(function(p){return p.id===id})[0]}
function routeById(id){return (T().routes||[]).filter(function(r){return r.id===id})[0]}
function pName(id,short){var p=placeById(id);return p?(short&&p.short||p.name):'?'}
function pQ(id){var p=placeById(id);return p?(p.query||p.name):''}
var MODE={auto:['Auto','driving'],taxi:['Taxi','driving'],bus:['Bus','transit'],walk:['Walk','walking'],car:['Car','driving'],train:['Train','transit']};
function dirLink(r){return 'https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(pQ(r.from))+'&destination='+encodeURIComponent(pQ(r.to))+(r.via&&r.via.length?'&waypoints='+encodeURIComponent(r.via.map(pQ).join('|')):'')+'&travelmode='+((MODE[r.mode]||MODE.auto)[1])}

function md(s){

    var m=l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if(m){if(!inl){out+='<ul>';inl=true}out+='<li>'+m[1]+'</li>'}
    else{if(inl){out+='</ul>';inl=false}var hh=l.match(/^#+\s*(.*)/);out+=hh?'<b>'+hh[1]+'</b><br>':(l.trim()?l+'<br>':'<br>')}
  });

function ask(q,onPart){
  q=(q||'').trim();if(!q||busy)return Promise.resolve('');
  chat.push({role:'user',content:q});
  var pend={role:'assistant',content:''};chat.push(pend);busy=true;render();
  if(!caps.sample){pend.content=offline(q);busy=false;ss(CK,chat);render();return Promise.resolve(pend.content)}
  var hist=chat.slice(0,-1).slice(-12);while(hist.length&&hist[0].role!=='user')hist.shift();
  var msgs=hist.map(function(m){return {role:m.role,content:m.content||'…'}});
  msgs[msgs.length-1]={role:'user',content:buildContext()+'\n\nTRAVELLER: '+q};
  return caps.sample(msgs,{tools:TOOLS,cache:false,onText:function(o){pend.content=o.text;if(onPart)onPart(o.text);var els=$$('.msg.a');var last=els[els.length-1];if(last)last.innerHTML=md(o.text||'')}}).then(function(r){pend.content=r.text||'Done.'}).catch(function(err){
    var c=err&&err.code;pend.content=(c==='not_granted')?'The AI assistant isn\'t set up on this site yet. '+'Here is what the offline guide says:\n\n'+offline(q):(c==='rate_limited'?((err&&err.message)||'Too many questions in a short time. Wait a minute and ask again.'):'I couldn\'t reach the '+AINAME+' assistant just now'+(err&&err.message?' ('+err.message+')':'')+'. '+offline(q));
    if(c==='not_granted')caps.sample=null;
  }).then(function(){busy=false;ss(CK,chat);render();return pend.content});
}
function offline(q){
  var lc=localCommand(q);if(lc)return lc.show||lc.say;
  var ql=q.toLowerCase(),c=ctx(),t=T();
  if(/now|next|what should/.test(ql)){return (c.cur?'**Now:** '+c.cur.title+' ('+fmt12(c.cur.time)+')\n':'')+(c.next?'**Next:** '+c.next.title+', '+whenLabel(evTs(c.next))+(c.next.notes?'\n- '+c.next.notes:''):'Nothing left on the plan.')}
  var words=ql.split(/\W+/).filter(function(w){return w.length>3});
  var best=null,bs=0;(t.guides||[]).forEach(function(g){var tx=(g.title+' '+g.body).toLowerCase(),s=0;words.forEach(function(w){if(tx.indexOf(w)>=0)s++});if(s>bs){bs=s;best=g}});
  if(best)return '**'+best.title+'**\n'+best.body;
  return 'I can\'t answer that offline. Try Search (top right), or check the Guides in More.';
}

  case 'rem-del':var r2=(t.reminders||[]).filter(function(x){return x.id===id})[0];if(r2)mutate(function(){t.reminders=t.reminders.filter(function(x){return x!==r2})},'Deleted reminder: '+r2.text);break;
  case 'alerts-on':
    chime();try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
    if('Notification' in window&&Notification.permission!=='granted'){try{Notification.requestPermission().then(function(p){toast(p==='granted'?'Alerts are on for this device.':'This browser blocked pop-up alerts. In-app alerts with sound still work while the app is open.');render()}).catch(function(){toast('Pop-up alerts aren\'t available here. In-app alerts with sound still work while the app is open.')})}catch(e){toast('Pop-up alerts aren\'t available here. In-app alerts with sound still work while the app is open.')}}
    else toast('In-app alerts with sound are on while this app is open.');break;
  case 'bud-edit':var b1=t.budget.filter(function(x){return x.id===id})[0];if(b1)expenseSheet(b1);break;
  case 'bud-del':var b2=t.budget.filter(function(x){return x.id===id})[0];closeSheet();if(b2)mutate(function(){t.budget=t.budget.filter(function(x){return x!==b2})},'Budget item removed: '+b2.label);break;
  case 'guide':ui.guide=id;go('more','guides',id);break;
  case 'guide-open':ui.guide=ui.guide===id?null:id;render();break;
  case 'guide-edit':guideSheet(guideById(id));break;
  case 'guide-new':guideSheet(null);break;
  case 'guide-del':var g1=guideById(id);closeSheet();if(g1)confirmSheet('Delete guide "'+g1.title+'"?','Delete',function(){mutate(function(){t.guides=t.guides.filter(function(x){return x!==g1})},'Guide deleted: '+g1.title)});break;
  case 'ct-new':contactSheet(null);break;
  case 'ct-edit':contactSheet(t.contacts.filter(function(x){return x.id===id})[0]);break;
  case 'ct-del':var p1=t.contacts.filter(function(x){return x.id===id})[0];closeSheet();if(p1)mutate(function(){t.contacts=t.contacts.filter(function(x){return x!==p1})},'Contact removed: '+p1.name);break;
  case 'trip-switch':S.activeTripId=id;ui.day=null;mutate(function(){},null);go('home');toast('Opened '+T().name);break;
  case 'trip-edit':tripSheet(S.trips.filter(function(x){return x.id===id})[0]);break;
  case 'trip-new':tripSheet(null);break;
  case 'trip-dup':var src=S.trips.filter(function(x){return x.id===id})[0];if(src)mutate(function(){var c=JSON.parse(JSON.stringify(src));c.id=uid('t');c.name=src.name+' (copy)';c.events.forEach(function(e){e.id=uid('e');e.status='todo'});c.checklist.forEach(function(x){x.id=uid('c');x.done=false});(c.reminders||[]).forEach(function(r){r.id=uid('r');r.done=false});c.budget.forEach(function(b){b.id=uid('b');b.actual=null});c.notes='';c.log=[];S.trips.push(c);S.activeTripId=c.id;ui.day=null},'Created from template: '+src.name);toast('Copy created. Edit its dates and steps.');break;
  case 'trip-del':var tr=S.trips.filter(function(x){return x.id===id})[0];if(tr)confirmSheet('Delete trip "'+tr.name+'" and everything in it?','Delete trip',function(){mutate(function(){S.trips=S.trips.filter(function(x){return x!==tr});if(S.activeTripId===tr.id)S.activeTripId=S.trips[0].id})});break;
  case 'rt-new':routeSheet(null);break;
  case 'rt-edit':var rt1=routeById(id);if(rt1)routeSheet(rt1);break;
  case 'rt-del':var rt2=routeById(id);closeSheet();if(rt2)mutate(function(){t.routes=t.routes.filter(function(x){return x!==rt2});t.events.forEach(function(e){if(e.route===rt2.id)e.route=''})},'Route deleted: '+rt2.title);break;
  case 'pl-new':placeSheet();break;
  case 'export':doExport();break;
  case 'preview':var pv=$('#previewt').value;if(pv){var p=pv.split('T');ui.offset=ts(p[0],p[1])-Date.now();ss(UIK,ui);go('home');toast('Previewing '+whenLabel(now()))}break;
  case 'preview-off':ui.offset=0;ss(UIK,ui);render();break;
  case 'qgo':closeSheet();var to=el.getAttribute('data-to');if(to==='plan'){ui.day=el.getAttribute('data-day');go('plan',null,id)}else if(to==='checklist'){ui.filter='all';go('checklist',null,id)}else{if(to==='guides')ui.guide=id;go('more',to,id)}break;
  }
});
document.addEventListener('submit',function(ev){
  var f=ev.target;if(f.closest('#sheetwrap'))return;ev.preventDefault();
  var k=f.getAttribute('data-form');
  if(k==='ask'){var q=$('#askbox').value;ask(q)}
  if(k==='v-type'){var vt=$('#vtype').value;runCommand(vt)}
  if(k==='cl-add'){var inp=f.querySelector('input'),tx=inp.value.trim(),g=f.getAttribute('data-group');if(tx){mutate(function(){T().checklist.push({id:uid('c'),group:g,text:tx,done:false})},'Checklist added: '+tx);var ni=$('[data-group="'+g.replace(/"/g,'\\"')+'"] input');if(ni)ni.focus()}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&vState.open){voiceClose();return}
  if(e.key==='Escape'&&sheetOpen)closeSheet();
  if(e.key==='Enter'&&!e.shiftKey&&e.target&&e.target.id==='askbox'){e.preventDefault();ask(e.target.value)}
});
var notesT=null;
document.addEventListener('input',function(e){if(e.target.id==='notesbox'){clearTimeout(notesT);var val=e.target.value;$('#notesst').textContent='Saving…';notesT=setTimeout(function(){T().notes=val;S.updatedAt=Date.now();ls(LS,S);unsynced=true;scheduleSync();var st=$('#notesst');if(st)st.textContent='Saved'},700)}});
document.addEventListener('change',function(e){
  if(e.target.id!=='importf')return;var file=e.target.files[0];if(!file)return;
  file.text().then(function(txt){var d=JSON.parse(txt);if(WEB&&webEmpty&&d.trips){S=d;webEmpty=false;save();render();toast('Trip restored and shared');return}var add=d.trips?d.trips:(d.events?[d]:null);if(!add)throw new Error('Not a Yatra Saathi backup');
    mutate(function(){add.forEach(function(tr){if(S.trips.some(function(x){return x.id===tr.id}))tr.id=uid('t');S.trips.push(tr)})},'Restored '+add.length+' trip(s) from backup');toast(add.length+' trip(s) added. Find them in Trips.')}).catch(function(err){toast('Couldn\'t read that file: '+err.message)});
});
function doExport(){
  var data=JSON.stringify(S,null,1),name='yatra-saathi-backup-'+istDate(Date.now())+'.json';
  if(WEB){try{var bl=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Backup downloaded');return}catch(e){}}
  if(caps.downloads){caps.downloads.save({filename:name,data:data}).then(function(){toast('Backup saved')}).catch(function(err){if(err&&err.code==='declined')return;copyFallback(data)})}else copyFallback(data);
}
function copyFallback(data){sheet('<h2>Copy your backup</h2><p class="small muted" style="margin:0">Downloads aren\'t available here. Copy this text and save it in a note or file.</p><textarea id="bk" style="min-height:200px" readonly>'+esc(data)+'</textarea><div class="btns"><button class="btn pri" type="submit">Copy</button></div>',function(f){try{navigator.clipboard.writeText(data).then(function(){toast('Copied')},function(){toast('Select the text and copy it manually')})}catch(e){toast('Select the text and copy it manually')}return false},function(){})}
window.addEventListener('hashchange',function(){var h=(location.hash||'').slice(1);if(['home','plan','checklist','assistant','more'].indexOf(h)>=0&&h!==ui.tab){ui.tab=h;render()}});
window.addEventListener('pagehide',saveUI);

/* ---------- mobile gestures ---------- */
var lastY=window.scrollY;
window.addEventListener('scroll',function(){var y=window.scrollY,f=$('.fab');if(f){if(y>lastY+8&&y>120)f.classList.add('away');else if(y<lastY-8||y<120)f.classList.remove('away')}lastY=y},{passive:true});
var tx=null,ty=null;
document.addEventListener('touchstart',function(e){if(ui.tab!=='plan'||sheetOpen||!e.target.closest('.tl'))return tx=null;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',function(e){if(tx===null)return;var dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;if(Math.abs(dx)<70||Math.abs(dy)>Math.abs(dx)*0.6)return;
  var dates=[];sorted().forEach(function(ev){if(dates.indexOf(ev.date)<0)dates.push(ev.date)});var i=dates.indexOf(ui.day)+(dx<0?1:-1);if(i<0||i>=dates.length)return;ui.day=dates[i];render();saveUI();var on=$('.days button.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});window.scrollTo(0,0)},{passive:true});
/* ---------- boot ---------- */
render();
if(ui.scroll){setTimeout(function(){window.scrollTo(0,ui.scroll)},30)}
setInterval(tick,20000);setTimeout(tick,1500);
setInterval(function(){if(ui.tab==='home'&&!sheetOpen&&!document.activeElement.matches('input,textarea,select'))render()},60000);
initCaps();
})();
</script>
